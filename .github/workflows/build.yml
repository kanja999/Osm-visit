name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek
        run: unzip -q MockLocationTester.zip

      - name: Perbaiki user agent dan cache peta
        run: |
          F=MockLocationTester/app/src/main/java/com/example/mocklocation/MainActivity.kt
          sed -i 's|userAgentValue = packageName|userAgentValue = "MockLocationTester/1.0 (https://github.com/kanja999/Osm-visit)"; osmdroidBasePath = java.io.File(cacheDir, "osm_v2"); osmdroidTileCache = java.io.File(cacheDir, "osm_v2/tiles")|' $F
          grep -q 'MockLocationTester/1.0' $F
          sed -i 's|Ketuk peta untuk memilih titik|v2 - Ketuk peta untuk memilih titik|' MockLocationTester/app/src/main/res/values/strings.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: MockLocationTester
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MockLocationTester-debug
          path: MockLocationTester/app/build/outputs/apk/debug/*.apk
