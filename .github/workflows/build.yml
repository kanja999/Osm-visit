name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek
        run: unzip -q MockLocationTester.zip

      - name: Perbaiki user agent peta
        run: |
          sed -i 's|userAgentValue = packageName|userAgentValue = "MockLocationTester/1.0 (https://github.com/kanja999/Osm-visit)"|' MockLocationTester/app/src/main/java/com/example/mocklocation/MainActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: MockLocationTester
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MockLocationTester-debug
          path: MockLocationTester/app/build/outputs/apk/debug/*.apk
